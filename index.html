<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Show do Milhão — Arduino + Redes</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#173b7a,#050b18 70%);color:#fff;min-height:100vh}
.wrap{max-width:700px;margin:auto;padding:18px}.card{background:linear-gradient(180deg,#10285a,#07142f);border:2px solid #d8b34b;border-radius:20px;padding:22px;box-shadow:0 0 30px #0008}.hidden{display:none}
h1{text-align:center;margin:8px 0;color:#ffd84d;font-size:30px}.sub{text-align:center;color:#cbd7ef;margin-bottom:18px}
.btn{width:100%;padding:15px;margin:7px 0;border:1px solid #7195d1;border-radius:12px;background:#10295b;color:white;font-size:17px;font-weight:bold;cursor:pointer}.btn:hover{background:#193b7d}
.answer{background:linear-gradient(90deg,#173c83,#10285a);text-align:left}.answer.correct{background:#176b38}.answer.wrong{background:#8c2020}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{padding:8px 12px;border-radius:20px;background:#091a3c;border:1px solid #536fa5}
.money{text-align:center;color:#ffe36e;font-size:25px;font-weight:bold;margin:8px}.qnum{text-align:center;color:#bcd0ef}.subject{text-align:center;color:#8fb1e8;font-size:14px;margin-top:6px}.question{font-size:21px;line-height:1.35;text-align:center;margin:20px 0}
.timer-label{text-align:center;color:#b9c8e6;font-weight:bold}.timer{text-align:center;font-size:34px;color:#ffe45c;font-weight:900;margin:2px}.urgent{color:#ff5757!important;animation:pulse .5s infinite alternate}@keyframes pulse{to{transform:scale(1.08)}}
.feedback{text-align:center;min-height:30px;font-weight:bold;margin:10px}.ladder{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-top:15px}.ladder div{padding:6px;text-align:center;background:#0a1c3e;border-radius:6px;font-size:12px}.ladder .active{background:#c08b12;color:#fff}.ladder .safe{border:1px solid #5fb77a}
.small{font-size:13px;color:#9fb2d6;text-align:center}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.actions .btn{font-size:13px;padding:11px}
.result{text-align:center}.result h2{color:#ffd84d;font-size:27px}.big{font-size:40px;color:#ffe45c;font-weight:900}
</style></head><body><div class="wrap">
<div id="home" class="card"><button id="soundBtn" onclick="toggleSound()">🔊 SOM: LIGADO</button>
<h1>🎤 SHOW DO MILHÃO</h1>
<div class="sub">🌐 REDES &nbsp; • &nbsp; 💻 PROGRAMAÇÃO</div>
<p style="text-align:center">Escolha seu desafio e teste seus conhecimentos!</p>
<button class="btn" onclick="startMode('redes')">🌐 JOGAR REDES</button>
<button class="btn" onclick="startMode('programacao')">💻 JOGAR PROGRAMAÇÃO</button>
  <button class="btn" onclick="review()">🔄 REVISAR ERROS</button>
<button class="btn" onclick="stats()">📊 ESTATÍSTICAS</button>
<p class="small">⏱️ 30 segundos por pergunta • 🎯 Teste seus conhecimentos!</p>
</div>

<div id="game" class="card hidden">
<div class="top"><div class="pill" id="count">1/24</div><div class="pill" id="score">R$ 0</div></div>
<div class="money" id="prize">R$ 1.000</div>
<div class="timer-label">⏱️ TEMPO PARA RESPONDER</div><div id="timer" class="timer">30 s</div>
<div class="qnum" id="topic">Questão</div><div class="subject" id="subject"></div><div class="question" id="question"></div>
<div id="answers"></div><div class="feedback" id="feedback"></div>
<div class="actions"><button class="btn" onclick="half()">50/50</button><button class="btn" id="skip" onclick="skip()">PULAR</button><button class="btn" onclick="stopGame()">PARAR</button></div>
</div>

<div id="result" class="card hidden result"><h2 id="resultTitle"></h2><div class="big" id="resultMoney"></div><p id="resultText"></p>
<button class="btn" onclick="start()">▶️ JOGAR NOVAMENTE</button><button class="btn" onclick="goHome()">🏠 VOLTAR AO INÍCIO</button></div>
<div id="stats" class="card hidden"><h1>📊 ESTATÍSTICAS</h1><p id="statsText"></p><button class="btn" onclick="goHome()">🏠 VOLTAR</button></div>
</div>
<script>
const questions = [{"q":"O que é um microprocessador?","options":["É um componente responsável por processar informações e executar instruções.","É uma placa de expansão usada para adicionar funcionalidades.","É um espaço na memória usado para armazenar valores.","É uma sequência de passos para resolver um problema."],"correct":0,"topic":"🤖 Arduino / LP"},{"q":"O programa Arduino é dividido em quais partes?","options":["Cabeçalho, declaração de variáveis, setup() e loop().","setup(), loop(), if() e switch().","Somente setup() e loop().","Cabeçalho, array, while e for."],"correct":0,"topic":"🤖 Arduino / LP"},{"q":"Qual é a função do setup()?","options":["Realizar as configurações iniciais e ser executado uma vez.","Executar os comandos repetidamente.","Verificar uma condição antes de executar.","Armazenar vários valores do mesmo tipo."],"correct":0,"topic":"🤖 Arduino / LP"},{"q":"Qual é a função do loop()?","options":["Executar os comandos repetidamente.","Realizar as configurações iniciais apenas uma vez.","Declarar todas as constantes.","Enviar o programa para o Arduino."],"correct":0,"topic":"🤖 Arduino / LP"},{"q":"O que é uma variável?","options":["Um espaço na memória usado para armazenar um valor que pode ser alterado.","Um valor que não deve ser alterado durante a execução.","Uma placa de expansão conectada ao Arduino.","Uma sequência de passos para resolver um problema."],"correct":0,"topic":"🤖 Arduino / LP"},{"q":"Qual alternativa apresenta exemplos de tipos de dados?","options":["int, char, boolean e void.","setup, loop, if e switch.","while, do while, for e array.","Arduino, Shield, IDE e algoritmo."],"correct":0,"topic":"🤖 Arduino / LP"},{"q":"O que é uma linguagem de programação?","options":["É o conjunto de regras e comandos que define a estrutura e o comportamento do programa.","É um trecho de texto que não é executado pelo programa.","É uma placa usada para adicionar funcionalidades.","É uma estrutura que armazena vários valores."],"correct":0,"topic":"🤖 Arduino / LP"},{"q":"O que é a sintaxe de uma linguagem?","options":["É o conjunto de regras de como os elementos da linguagem devem ser escritos e combinados.","É a sequência de passos para realizar uma tarefa.","É a configuração inicial do Arduino.","É o valor armazenado em uma constante."],"correct":0,"topic":"🤖 Arduino / LP"},{"q":"O que é um comentário?","options":["Um trecho de texto usado para explicar ou documentar o código e que não é executado.","Um comando executado repetidamente pelo Arduino.","Uma variável que pode mudar de valor.","Uma placa de expansão do Arduino."],"correct":0,"topic":"🤖 Arduino / LP"},{"q":"Constantes são variáveis que podem ter seus valores alterados?","options":["Não. Constantes possuem valores que não devem ser alterados durante a execução.","Sim. Toda constante deve ser alterada pelo loop().","Sim. Constantes são sempre variáveis temporárias.","Não. Constantes são usadas somente dentro do setup()."],"correct":0,"topic":"🤖 Arduino / LP"},{"q":"Quais são as funções usadas para estruturas de repetição?","options":["while, do while e for.","if, switch e setup.","array, char e boolean.","setup, loop e IDE."],"correct":0,"topic":"🤖 Arduino / LP"},{"q":"Como funciona o do while?","options":["Executa primeiro os comandos e depois verifica a condição, sendo executado pelo menos uma vez.","Verifica a condição antes e nunca executa o bloco.","Executa somente uma vez e não verifica condição.","Escolhe entre vários casos de um programa."],"correct":0,"topic":"🤖 Arduino / LP"},{"q":"Qual é a diferença entre while e do while?","options":["while verifica a condição antes; do while executa primeiro e verifica depois.","while executa primeiro; do while verifica primeiro.","Ambos sempre executam exatamente uma vez.","while é usado para arrays; do while para constantes."],"correct":0,"topic":"🤖 Arduino / LP"},{"q":"O que é um vetor (array)?","options":["Uma estrutura que armazena vários valores do mesmo tipo em uma única variável, usando posições (índices).","Uma variável que só pode armazenar um valor.","Uma placa de expansão do Arduino.","Um software para compilar programas."],"correct":0,"topic":"🤖 Arduino / LP"},{"q":"O que faz a função if (x < 5)?","options":["Verifica se x é menor que 5 e executa os comandos dentro do if se a condição for verdadeira.","Verifica se x é maior que 5 e sempre executa os comandos.","Repete o comando enquanto x for menor que 5.","Armazena cinco valores em um vetor."],"correct":0,"topic":"🤖 Arduino / LP"},{"q":"Qual é a diferença entre microprocessador e microcontrolador?","options":["Microprocessador é responsável principalmente pelo processamento; microcontrolador reúne processador, memória e outros recursos em um único chip.","Microprocessador é uma placa de expansão; microcontrolador é uma IDE.","Microprocessador armazena somente constantes; microcontrolador armazena somente arrays.","Não existe diferença entre eles."],"correct":0,"topic":"🤖 Arduino / LP"},{"q":"O Arduino possui baixo processamento comparado ao microprocessador?","options":["Sim. Por usar um microcontrolador, possui capacidade mais limitada que sistemas baseados em microprocessadores mais potentes.","Não. O Arduino sempre possui mais processamento que um microprocessador.","Não. Arduino não possui processador.","Sim. Porque o Arduino funciona somente como uma IDE."],"correct":0,"topic":"🤖 Arduino / LP"},{"q":"Qual é a linguagem do Arduino?","options":["A linguagem utilizada pelo Arduino é baseada em C/C++.","É exclusivamente Java.","É exclusivamente Python.","É uma linguagem baseada apenas em HTML."],"correct":0,"topic":"🤖 Arduino / LP"},{"q":"O que é uma Shield?","options":["Uma placa de expansão que pode ser conectada ao Arduino para adicionar novas funcionalidades.","Um tipo de variável.","Uma estrutura de repetição.","Um ambiente para compilar programas."],"correct":0,"topic":"🤖 Arduino / LP"},{"q":"Quais são as duas funções principais no Arduino?","options":["setup() e loop().","while e for.","if e switch.","int e char."],"correct":0,"topic":"🤖 Arduino / LP"},{"q":"O que é uma IDE?","options":["Um Ambiente de Desenvolvimento Integrado usado para escrever, editar, compilar e enviar programas para o Arduino.","Uma estrutura para armazenar vários valores.","Uma placa de expansão.","Um comando de repetição."],"correct":0,"topic":"🤖 Arduino / LP"},{"q":"O que é um algoritmo?","options":["Uma sequência de passos e instruções organizados para realizar uma tarefa ou resolver um problema.","Um valor que não pode ser alterado.","Uma placa conectada ao Arduino.","Uma função executada apenas uma vez."],"correct":0,"topic":"🤖 Arduino / LP"},{"q":"Qual associação está correta?","options":["setup() → configura → 1 vez","setup() → repete → continuamente","while → executa → verifica","variável → valor não muda"],"correct":0,"topic":"🤖 Arduino / LP"},{"q":"Qual associação está correta sobre repetição?","options":["while → verifica → executa","do while → executa → verifica","for → escolhe casos","if → estrutura de repetição"],"correct":0,"topic":"🤖 Arduino / LP"},{"q":"Qual estrutura é usada para escolher entre casos?","options":["switch.","array.","setup().","loop()."],"correct":0,"topic":"🤖 Arduino / LP"},{"q":"1. As duas principais classes de redes estudadas são:","options":["Redes de difusão e redes ponto-a-ponto","Redes LAN e WAN","Redes cliente-servidor e peer-to-peer","Redes locais e metropolitanas"],"correct":0,"exp":"Redes de difusão e redes ponto-a-ponto","topic":"🌐 Redes"},{"q":"2. Em uma rede de difusão:","options":["Existe um canal compartilhado por todas as máquinas","Cada máquina possui um circuito exclusivo","Os pacotes seguem sempre um caminho virtual","Existe comunicação apenas ponto a ponto"],"correct":0,"exp":"Existe um canal compartilhado por todas as máquinas","topic":"🌐 Redes"},{"q":"3. Na topologia em barramento:","options":["Os dispositivos compartilham um mesmo meio/barramento","Os dispositivos se conectam a um elemento central","Todos os dispositivos estão ligados entre si","Cada dispositivo possui um caminho exclusivo"],"correct":0,"exp":"Os dispositivos compartilham um mesmo meio/barramento","topic":"🌐 Redes"},{"q":"4. Na topologia em estrela:","options":["A comunicação passa por um elemento central","Todos os dispositivos compartilham diretamente o mesmo barramento","Cada dispositivo se conecta diretamente a todos os outros","Os dispositivos formam um circuito fechado"],"correct":0,"exp":"A comunicação passa por um elemento central","topic":"🌐 Redes"},{"q":"5. Qual topologia oferece máxima redundância, com todos os elementos ligados entre si?","options":["Topologia Completa","Topologia em Estrela","Topologia em Barramento","Topologia em Anel"],"correct":0,"exp":"Topologia Completa","topic":"🌐 Redes"},{"q":"6. A topologia irregular pode resultar:","options":["Do crescimento não planejado da rede","Da conexão obrigatória a um elemento central","Da existência de um único barramento","Da utilização exclusiva de circuitos virtuais"],"correct":0,"exp":"Do crescimento não planejado da rede","topic":"🌐 Redes"},{"q":"7. Na comutação de circuitos:","options":["É dedicado um circuito fixo para a comunicação","A mensagem é dividida em pacotes independentes","Cada pacote pode seguir um caminho diferente","Os pacotes seguem um caminho virtual compartilhado"],"correct":0,"exp":"É dedicado um circuito fixo para a comunicação","topic":"🌐 Redes"},{"q":"8. Na comutação de pacotes:","options":["A mensagem é fracionada em partes menores","É dedicado um circuito fixo para toda a comunicação","Todos os pacotes seguem obrigatoriamente o mesmo caminho físico","Cada máquina utiliza um canal exclusivo"],"correct":0,"exp":"A mensagem é fracionada em partes menores","topic":"🌐 Redes"},{"q":"9. Na comutação por datagrama:","options":["Cada pacote é uma unidade autônoma e pode seguir caminhos diferentes","Os pacotes seguem um caminho virtual estabelecido","É dedicado um circuito fixo para a comunicação","Todos os dados usam um único circuito físico"],"correct":0,"exp":"Cada pacote é uma unidade autônoma e pode seguir caminhos diferentes","topic":"🌐 Redes"},{"q":"10. Na comutação por circuito virtual:","options":["Os pacotes seguem um caminho virtual estabelecido","Cada pacote escolhe obrigatoriamente um caminho diferente","É dedicado um circuito físico exclusivo","A mensagem não é dividida em pacotes"],"correct":0,"exp":"Os pacotes seguem um caminho virtual estabelecido","topic":"🌐 Redes"},{"q":"11. Os dois tipos de circuito virtual são:","options":["PVC e SVC","LAN e WAN","TCP e UDP","PAN e MAN"],"correct":0,"exp":"PVC e SVC","topic":"🌐 Redes"},{"q":"12. PAN significa:","options":["Personal Area Network","Private Area Network","Public Access Network","Personal Access Node"],"correct":0,"exp":"Personal Area Network","topic":"🌐 Redes"},{"q":"13. Uma LAN normalmente está associada a:","options":["Um edifício ou campus","Uma cidade ou região metropolitana","Uma grande área geográfica distribuída","Uma área exclusivamente pessoal"],"correct":0,"exp":"Um edifício ou campus","topic":"🌐 Redes"},{"q":"14. Uma MAN normalmente abrange:","options":["Uma cidade ou região metropolitana","Um edifício ou campus","Uma área pessoal de pequeno alcance","Uma grande área geográfica distribuída mundialmente"],"correct":0,"exp":"Uma cidade ou região metropolitana","topic":"🌐 Redes"},{"q":"15. Uma WAN é uma rede:","options":["Geograficamente distribuída e de grande abrangência","Restrita a um edifício ou campus","Limitada a uma cidade","Exclusivamente pessoal"],"correct":0,"exp":"Geograficamente distribuída e de grande abrangência","topic":"🌐 Redes"},{"q":"17. Quantas camadas possui o modelo ISO/OSI?","options":["7","4","5","8"],"correct":0,"exp":"7","topic":"🌐 Redes"},{"q":"18. A ordem correta, da inferior para a superior, é:","options":["Física -> Enlace -> Rede -> Transporte -> Sessão -> Apresentação -> Aplicação","Física -> Rede -> Enlace -> Transporte -> Sessão -> Aplicação -> Apresentação","Aplicação -> Apresentação -> Sessão -> Transporte -> Rede -> Enlace -> Física","Física -> Enlace -> Transporte -> Rede -> Sessão -> Apresentação -> Aplicação"],"correct":0,"exp":"Física -> Enlace -> Rede -> Transporte -> Sessão -> Apresentação -> Aplicação","topic":"🌐 Redes"},{"q":"19. A camada Física é responsável principalmente por:","options":["Transmissão dos bits e meios físicos","Endereçamento lógico e estabelecimento de rotas","Controle de fluxo e integridade da transmissão","Serviços de rede às aplicações"],"correct":0,"exp":"Transmissão dos bits e meios físicos","topic":"🌐 Redes"},{"q":"20. A camada de Rede é responsável por:","options":["Endereçamento lógico e estabelecimento de rotas","Transmissão dos bits e meios físicos","Tradução, compressão e criptografia","Controle de fluxo e integridade da transmissão"],"correct":0,"exp":"Endereçamento lógico e estabelecimento de rotas","topic":"🌐 Redes"},{"q":"21. A camada de Transporte está relacionada a:","options":["Controle de fluxo e integridade da transmissão","Endereçamento lógico e estabelecimento de rotas","Transmissão dos bits e meios físicos","Tradução, compressão e criptografia"],"correct":0,"exp":"Controle de fluxo e integridade da transmissão","topic":"🌐 Redes"},{"q":"22. A camada de Sessão está relacionada a:","options":["Estabelecimento, manutenção e sincronização da interação entre sistemas","Endereçamento lógico e estabelecimento de rotas","Controle de fluxo e integridade da transmissão","Fornecimento de serviços de rede às aplicações"],"correct":0,"exp":"Estabelecimento, manutenção e sincronização da interação entre sistemas","topic":"🌐 Redes"},{"q":"23. A camada de Apresentação está relacionada a:","options":["Tradução, compressão e criptografia","Estabelecimento de rotas e endereçamento lógico","Controle de fluxo e integridade","Transmissão dos bits pelo meio físico"],"correct":0,"exp":"Tradução, compressão e criptografia","topic":"🌐 Redes"},{"q":"24. A camada de Aplicação:","options":["Fornece serviços de rede às aplicações","Estabelece rotas entre redes","Transmite bits pelo meio físico","Controla o fluxo entre dispositivos"],"correct":0,"exp":"Fornece serviços de rede às aplicações","topic":"🌐 Redes"},{"q":"41. O DHCP tem como função:","options":["Distribuir automaticamente IP, máscara, gateway padrão e outras configurações","Traduzir nomes de domínio para endereços IP","Traduzir endereços privados em públicos","Permitir a saída da rede local para outras redes"],"correct":0,"exp":"Distribuir automaticamente IP, máscara, gateway padrão e outras configurações","topic":"🌐 Redes"},{"q":"44. O DNS tem como função:","options":["Traduzir nomes de domínio para seus respectivos endereços IP","Distribuir automaticamente endereços IP","Traduzir endereços privados para públicos","Controlar a quantidade de dados transmitidos"],"correct":0,"exp":"Traduzir nomes de domínio para seus respectivos endereços IP","topic":"🌐 Redes"}];
const prizes = [1000,1500,2000,2500,3000,4000,5000,6000,7000,8000,10000,12000,15000,18000,20000,25000,30000,35000,40000,45000,50000,60000,70000,80000];
let pool=[],idx=0,money=0,correct=0,wrong=0,skipUsed=false,halfUsed=false,timerId=null,time=30,answered=false;
  let gameMode='all';
  function startMode(mode){gameMode=mode;start();}
const $=id=>document.getElementById(id);
  let soundOn = true;
  let bgMusic = new Audio('show-do-milhao02.mp3');
bgMusic.loop = true;
  const somCerto = new Audio('acertou-mizeravijk.mp3');
const somErrado = new Audio('errada-portiolli.mp3');

somCerto.preload = 'auto';
somErrado.preload = 'auto';

somCerto.load();
somErrado.load();
document.addEventListener('touchstart',()=>{if(soundOn){bgMusic.play().catch(()=>{});}});

function toggleSound(){
  soundOn = !soundOn;
  document.getElementById('soundBtn').textContent =
    soundOn ? '🔊 SOM: LIGADO' : '🔇 SOM: DESLIGADO';
}
function hideAll(){['home','game','result','stats'].forEach(x=>$(x).classList.add('hidden'))}
function goHome(){clearInterval(timerId);hideAll();$('home').classList.remove('hidden')}
function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1])}
function start(){
  if(soundOn)new Audio('sera-que-alguem-vai-ganhar-1-milhao-de-reais.mp3').play();let base=questions.map((q,i)=>({q,i}));if(gameMode==='redes')base=base.filter(x=>x.q.topic==='🌐 Redes');if(gameMode==='programacao')base=base.filter(x=>x.q.topic==='🤖 Arduino / LP');pool=shuffle(base.map(x=>x.i));begin()}
  if(soundOn)bgMusic.play();
function review(){let w=JSON.parse(localStorage.getItem('milhaoWrong')||'[]'); pool=w.filter(i=>i>=0&&i<questions.length); if(!pool.length){alert('Você ainda não tem questões erradas para revisar.');return} begin()}
function begin(){idx=0;money=0;correct=0;wrong=0;skipUsed=false;halfUsed=false;hideAll();$('game').classList.remove('hidden');load()}
function load(){answered=false;time=30;clearInterval(timerId);$('timer').textContent='30 s';$('timer').classList.remove('urgent');$('skip').disabled=skipUsed;let q=questions[pool[idx]];$('count').textContent=(idx+1)+'/'+pool.length;$('score').textContent='R$ '+money.toLocaleString('pt-BR');$('prize').textContent='R$ '+(prizes[idx]||prizes[prizes.length-1]).toLocaleString('pt-BR');$('topic').textContent='Questão '+(idx+1);$('subject').textContent=q.topic||'';$('question').textContent=q.q;$('feedback').textContent='';let opts=shuffle(q.options.map((text,i)=>({text,correct:i===q.correct})));$('answers').innerHTML='';opts.forEach((o,i)=>{let b=document.createElement('button');b.className='btn answer';b.textContent=String.fromCharCode(65+i)+') '+o.text;b.dataset.correct=o.correct;b.onclick=()=>answer(b,!!o.correct);$('answers').appendChild(b)});timerId=setInterval(()=>{time--;$('timer').textContent=time+' s';if(time<=10)$('timer').classList.add('urgent');if(time<=0){clearInterval(timerId);timeout()}},1000)}
function answer(btn,isCorrect){if(answered)return;answered=trueif (isCorrect) {
    somCerto.currentTime = 0;
    somCerto.play();
} else {
    somErrado.currentTime = 0;
    somErrado.play();
}clearInterval(timerId);let q=questions[pool[idx]];document.querySelectorAll('.answer').forEach(b=>b.disabled=true);if(isCorrect){btn.classList.add('correct');correct++;money=prizes[idx]||money;$('score').textContent='R$ '+money.toLocaleString('pt-BR');$('feedback').textContent='✅ CORRETO!';setTimeout(next,900)}else{btn.classList.add('wrong');wrong++;money=0;saveWrong(pool[idx]);$('feedback').textContent='❌ ERRADO! Você perdeu toda a premiação. Resposta correta: '+q.options[q.correct];setTimeout(()=>finish('wrong'),1900)}}
function next(){idx++;if(idx>=pool.length)finish('success');else load()}
function finish(type){clearInterval(timerId);hideAll();$('result').classList.remove('hidden');$('resultMoney').textContent='R$ '+money.toLocaleString('pt-BR');if(type==='success'){$('resultTitle').textContent='🎉 PARABÉNS! VOCÊ CONCLUIU!';$('resultText').textContent='Você terminou a rodada com '+correct+' acertos.'}else if(type==='timeout'){$('resultTitle').textContent='⏰ TEMPO ESGOTADO!';$('resultText').textContent='Você perdeu toda a premiação.';money=0;$('resultMoney').textContent='R$ 0'}else{$('resultTitle').textContent='❌ VOCÊ ERROU!';$('resultText').textContent='Você perdeu toda a premiação.'}}
function timeout(){money=0;saveWrong(pool[idx]);$('feedback').textContent='⏰ TEMPO ESGOTADO! Resposta correta: '+questions[pool[idx]].options[questions[pool[idx]].correct];finish('timeout')}
function stopGame(){clearInterval(timerId);hideAll();$('result').classList.remove('hidden');$('resultTitle').textContent='🏆 VOCÊ PAROU!';$('resultMoney').textContent='R$ '+money.toLocaleString('pt-BR');$('resultText').textContent='Você ficou com o valor conquistado até aqui.'}
function half(){if(halfUsed||answered)return;halfUsed=true;let bs=[...document.querySelectorAll('.answer')].filter(b=>b.dataset.correct==='false');shuffle(bs).slice(0,2).forEach(b=>{b.style.visibility='hidden'})}
function skip(){if(skipUsed||answered)return;skipUsed=true;idx++;if(idx>=pool.length)finish('success');else load()}
function saveWrong(i){let w=JSON.parse(localStorage.getItem('milhaoWrong')||'[]');if(!w.includes(i))w.push(i);localStorage.setItem('milhaoWrong',JSON.stringify(w));}
function stats(){hideAll();$('stats').classList.remove('hidden');let t=+localStorage.getItem('milhaoTotal')||0,a=+localStorage.getItem('milhaoCorrect')||0,w=+localStorage.getItem('milhaoErrors')||0;$('statsText').innerHTML='Total de respostas: <b>'+t+'</b><br>Acertos: <b>'+a+'</b><br>Erros: <b>'+w+'</b>'}
document.addEventListener('click',e=>{if(e.target.classList.contains('answer')){let t=+localStorage.getItem('milhaoTotal')||0;localStorage.setItem('milhaoTotal',t+1);if(e.target.dataset.correct==='true'){let a=+localStorage.getItem('milhaoCorrect')||0;localStorage.setItem('milhaoCorrect',a+1)}else{let w=+localStorage.getItem('milhaoErrors')||0;localStorage.setItem('milhaoErrors',w+1)}}});
</script></body></html>
