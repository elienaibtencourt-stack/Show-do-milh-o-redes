function review(){let w=JSON.parse(localStorage.getItem('milhaoWrong')||'[]');pool=w.filter(i=>i>=0&&i<questions.length);if(!pool.length){alert('Você ainda não tem questões erradas para revisar.');return}gameMode='all';begin()}
function begin(){idx=0;money=0;correct=0;wrong=0;skipUsed=false;halfUsed=false;hideAll();$('game').classList.remove('hidden');load()}
function load(){answered=false;time=30;clearInterval(timerId);$('timer').textContent='30 s';$('timer').classList.remove('urgent');$('skip').disabled=skipUsed;let q=questions[pool[idx]];$('count').textContent=(idx+1)+'/'+pool.length;$('score').textContent='R$ '+money.toLocaleString('pt-BR');$('prize').textContent='R$ '+(prizes[idx]||prizes[prizes.length-1]).toLocaleString('pt-BR');$('topic').textContent='Questão '+(idx+1);$('subject').textContent=q.topic||'';$('question').textContent=q.q;$('feedback').textContent='';let opts=shuffle(q.options.map((text,i)=>({text,correct:i===q.correct})));$('answers').innerHTML='';opts.forEach((o,i)=>{let b=document.createElement('button');b.className='btn answer';b.textContent=String.fromCharCode(65+i)+') '+o.text;b.dataset.correct=o.correct?'true':'false';b.onclick=()=>answer(b,o.correct);$('answers').appendChild(b)});timerId=setInterval(()=>{time--;$('timer').textContent=time+' s';if(time<=10)$('timer').classList.add('urgent');if(time<=0){clearInterval(timerId);timeout()}},1000)}
function answer(btn,isCorrect){if(answered)return;answered=true;clearInterval(timerId);let q=questions[pool[idx]];document.querySelectorAll('.answer').forEach(b=>b.disabled=true);if(isCorrect){playAudio(somCerto);btn.classList.add('correct');correct++;money=prizes[idx]||money;$('score').textContent='R$ '+money.toLocaleString('pt-BR');$('feedback').textContent='✅ CORRETO!';setTimeout(next,900)}else{playAudio(somErrado);btn.classList.add('wrong');wrong++;money=0;saveWrong(pool[idx]);$('feedback').textContent='❌ ERRADO! Você perdeu toda a premiação. Resposta correta: '+q.options[q.correct];setTimeout(()=>finish('wrong'),1900)}}
function next(){idx++;if(idx>=pool.length)finish('success');else load()}
function finish(type){clearInterval(timerId);hideAll();$('result').classList.remove('hidden');$('resultMoney').textContent='R$ '+money.toLocaleString('pt-BR');if(type==='success'){$('resultTitle').textContent='🎉 PARABÉNS! VOCÊ CONCLUIU!';$('resultText').textContent='Você terminou a rodada com '+correct+' acertos e chegou a R$ '+money.toLocaleString('pt-BR')+'.'}else if(type==='timeout'){$('resultTitle').textContent='⏰ TEMPO ESGOTADO!';$('resultText').textContent='Você perdeu toda a premiação.';money=0;$('resultMoney').textContent='R$ 0'}else{$('resultTitle').textContent='❌ VOCÊ ERROU!';$('resultText').textContent='Você perdeu toda a premiação.'}}
function timeout(){money=0;saveWrong(pool[idx]);$('feedback').textContent='⏰ TEMPO ESGOTADO! Resposta correta: '+questions[pool[idx]].options[questions[pool[idx]].correct];finish('timeout')}
function stopGame(){clearInterval(timerId);hideAll();$('result').classList.remove('hidden');$('resultTitle').textContent='🏆 VOCÊ PAROU!';$('resultMoney').textContent='R$ '+money.toLocaleString('pt-BR');$('resultText').textContent='Você ficou com o valor conquistado até aqui.'}
function half(){if(halfUsed||answered)return;halfUsed=true;let bs=[...document.querySelectorAll('.answer')].filter(b=>b.dataset.correct==='false');shuffle(bs).slice(0,2).forEach(b=>b.style.visibility='hidden')}
function skip(){if(skipUsed||answered)return;skipUsed=true;idx++;if(idx>=pool.length)finish('success');else load()}
function saveWrong(i){let w=JSON.parse(localStorage.getItem('milhaoWrong')||'[]');if(!w.includes(i))w.push(i);localStorage.setItem('milhaoWrong',JSON.stringify(w))}
function stats(){hideAll();$('stats').classList.remove('hidden');let t=+localStorage.getItem('milhaoTotal')||0,a=+localStorage.getItem('milhaoCorrect')||0,w=+localStorage.getItem('milhaoErrors')||0;$('statsText').innerHTML='Total de respostas: <b>'+t+'</b><br>Acertos: <b>'+a+'</b><br>Erros: <b>'+w+'</b>'}
document.addEventListener('click',e=>{if(e.target.classList.contains('answer')){let t=+localStorage.getItem('milhaoTotal')||0;localStorage.setItem('milhaoTotal',t+1);if(e.target.dataset.correct==='true'){let a=+localStorage.getItem('milhaoCorrect')||0;localStorage.setItem('milhaoCorrect',a+1)}else{let w=+localStorage.getItem('milhaoErrors')||0;localStorage.setItem('milhaoErrors',w+1)}}});
</script></body></html>
