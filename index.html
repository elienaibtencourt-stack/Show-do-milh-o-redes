<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Show do Milhão — Arduino</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#173b7a,#050b18 70%);color:#fff;min-height:100vh}
.wrap{max-width:700px;margin:auto;padding:18px}.card{background:linear-gradient(180deg,#10285a,#07142f);border:2px solid #d8b34b;border-radius:20px;padding:22px;box-shadow:0 0 30px #0008}.hidden{display:none}
h1{text-align:center;margin:8px 0;color:#ffd84d;font-size:30px}.sub{text-align:center;color:#cbd7ef;margin-bottom:18px}
.btn{width:100%;padding:15px;margin:7px 0;border:1px solid #7195d1;border-radius:12px;background:#10295b;color:white;font-size:17px;font-weight:bold;cursor:pointer}.btn:hover{background:#193b7d}
.answer{background:linear-gradient(90deg,#173c83,#10285a);text-align:left}.answer.correct{background:#176b38}.answer.wrong{background:#8c2020}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{padding:8px 12px;border-radius:20px;background:#091a3c;border:1px solid #536fa5}
.money{text-align:center;color:#ffe36e;font-size:25px;font-weight:bold;margin:8px}.qnum{text-align:center;color:#bcd0ef}.question{font-size:21px;line-height:1.35;text-align:center;margin:20px 0}
.timer-label{text-align:center;color:#b9c8e6;font-weight:bold}.timer{text-align:center;font-size:34px;color:#ffe45c;font-weight:900;margin:2px}.urgent{color:#ff5757!important;animation:pulse .5s infinite alternate}@keyframes pulse{to{transform:scale(1.08)}}
.feedback{text-align:center;min-height:30px;font-weight:bold;margin:10px}.ladder{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-top:15px}.ladder div{padding:6px;text-align:center;background:#0a1c3e;border-radius:6px;font-size:12px}.ladder .active{background:#c08b12;color:#fff}.ladder .safe{border:1px solid #5fb77a}
.small{font-size:13px;color:#9fb2d6;text-align:center}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.actions .btn{font-size:13px;padding:11px}
.result{text-align:center}.result h2{color:#ffd84d;font-size:27px}.big{font-size:40px;color:#ffe45c;font-weight:900}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07142f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Show do Milhão">
</head><body><div class="wrap">
<div id="home" class="card">
<h1>🎤 SHOW DO MILHÃO</h1><div class="sub">ARDUINO • LP • MATERIAL DA PROVA</div>
<p style="text-align:center">Responda às perguntas do seu suprassumo, com alternativas parecidas para testar se você realmente sabe.</p>
<button class="btn" onclick="start()">▶️ COMEÇAR</button>
<button class="btn" onclick="review()">🔄 REVISAR ERROS</button>
<button class="btn" onclick="stats()">📊 ESTATÍSTICAS</button>
<p class="small">21 perguntas • 50/50 • Pular • Parar • 30 segundos</p>
</div>

<div id="game" class="card hidden">
<div class="top"><div class="pill" id="count">1/24</div><div class="pill" id="score">R$ 0</div></div>
<div class="money" id="prize">R$ 1.000</div>
<div class="timer-label">⏱️ TEMPO PARA RESPONDER</div><div id="timer" class="timer">30 s</div>
<div class="qnum" id="topic">Questão</div><div class="question" id="question"></div>
<div id="answers"></div><div class="feedback" id="feedback"></div>
<div class="actions"><button class="btn" onclick="half()">50/50</button><button class="btn" id="skip" onclick="skip()">PULAR</button><button class="btn" onclick="stopGame()">PARAR</button></div>
</div>

<div id="result" class="card hidden result"><h2 id="resultTitle"></h2><div class="big" id="resultMoney"></div><p id="resultText"></p>
<button class="btn" onclick="start()">▶️ JOGAR NOVAMENTE</button><button class="btn" onclick="goHome()">🏠 VOLTAR AO INÍCIO</button></div>
<div id="stats" class="card hidden"><h1>📊 ESTATÍSTICAS</h1><p id="statsText"></p><button class="btn" onclick="goHome()">🏠 VOLTAR</button></div>
</div>
<script>
const questions = [{"q": "O que é um microprocessador?", "options": ["É um componente responsável por processar informações e executar instruções.", "É uma placa de expansão usada para adicionar funcionalidades.", "É um espaço na memória usado para armazenar valores.", "É uma sequência de passos para resolver um problema."], "correct": 0}, {"q": "O programa Arduino é dividido em quais partes?", "options": ["Cabeçalho, declaração de variáveis, setup() e loop().", "setup(), loop(), if() e switch().", "Somente setup() e loop().", "Cabeçalho, array, while e for."], "correct": 0}, {"q": "Qual é a função do setup()?", "options": ["Realizar as configurações iniciais e ser executado uma vez.", "Executar os comandos repetidamente.", "Verificar uma condição antes de executar.", "Armazenar vários valores do mesmo tipo."], "correct": 0}, {"q": "Qual é a função do loop()?", "options": ["Executar os comandos repetidamente.", "Realizar as configurações iniciais apenas uma vez.", "Declarar todas as constantes.", "Enviar o programa para o Arduino."], "correct": 0}, {"q": "O que é uma variável?", "options": ["Um espaço na memória usado para armazenar um valor que pode ser alterado.", "Um valor que não deve ser alterado durante a execução.", "Uma placa de expansão conectada ao Arduino.", "Uma sequência de passos para resolver um problema."], "correct": 0}, {"q": "Qual alternativa apresenta exemplos de tipos de dados?", "options": ["int, char, boolean e void.", "setup, loop, if e switch.", "while, do while, for e array.", "Arduino, Shield, IDE e algoritmo."], "correct": 0}, {"q": "O que é uma linguagem de programação?", "options": ["É o conjunto de regras e comandos que define a estrutura e o comportamento do programa.", "É um trecho de texto que não é executado pelo programa.", "É uma placa usada para adicionar funcionalidades.", "É uma estrutura que armazena vários valores."], "correct": 0}, {"q": "O que é a sintaxe de uma linguagem?", "options": ["É o conjunto de regras de como os elementos da linguagem devem ser escritos e combinados.", "É a sequência de passos para realizar uma tarefa.", "É a configuração inicial do Arduino.", "É o valor armazenado em uma constante."], "correct": 0}, {"q": "O que é um comentário?", "options": ["Um trecho de texto usado para explicar ou documentar o código e que não é executado.", "Um comando executado repetidamente pelo Arduino.", "Uma variável que pode mudar de valor.", "Uma placa de expansão do Arduino."], "correct": 0}, {"q": "Constantes são variáveis que podem ter seus valores alterados?", "options": ["Não. Constantes possuem valores que não devem ser alterados durante a execução.", "Sim. Toda constante deve ser alterada pelo loop().", "Sim. Constantes são sempre variáveis temporárias.", "Não. Constantes são usadas somente dentro do setup()."], "correct": 0}, {"q": "Quais são as funções usadas para estruturas de repetição?", "options": ["while, do while e for.", "if, switch e setup.", "array, char e boolean.", "setup, loop e IDE."], "correct": 0}, {"q": "Como funciona o do while?", "options": ["Executa primeiro os comandos e depois verifica a condição, sendo executado pelo menos uma vez.", "Verifica a condição antes e nunca executa o bloco.", "Executa somente uma vez e não verifica condição.", "Escolhe entre vários casos de um programa."], "correct": 0}, {"q": "Qual é a diferença entre while e do while?", "options": ["while verifica a condição antes; do while executa primeiro e verifica depois.", "while executa primeiro; do while verifica primeiro.", "Ambos sempre executam exatamente uma vez.", "while é usado para arrays; do while para constantes."], "correct": 0}, {"q": "O que é um vetor (array)?", "options": ["Uma estrutura que armazena vários valores do mesmo tipo em uma única variável, usando posições (índices).", "Uma variável que só pode armazenar um valor.", "Uma placa de expansão do Arduino.", "Um software para compilar programas."], "correct": 0}, {"q": "O que faz a função if (x < 5)?", "options": ["Verifica se x é menor que 5 e executa os comandos dentro do if se a condição for verdadeira.", "Verifica se x é maior que 5 e sempre executa os comandos.", "Repete o comando enquanto x for menor que 5.", "Armazena cinco valores em um vetor."], "correct": 0}, {"q": "Qual é a diferença entre microprocessador e microcontrolador?", "options": ["Microprocessador é responsável principalmente pelo processamento; microcontrolador reúne processador, memória e outros recursos em um único chip.", "Microprocessador é uma placa de expansão; microcontrolador é uma IDE.", "Microprocessador armazena somente constantes; microcontrolador armazena somente arrays.", "Não existe diferença entre eles."], "correct": 0}, {"q": "O Arduino possui baixo processamento comparado ao microprocessador?", "options": ["Sim. Por usar um microcontrolador, possui capacidade mais limitada que sistemas baseados em microprocessadores mais potentes.", "Não. O Arduino sempre possui mais processamento que um microprocessador.", "Não. Arduino não possui processador.", "Sim. Porque o Arduino funciona somente como uma IDE."], "correct": 0}, {"q": "Qual é a linguagem do Arduino?", "options": ["A linguagem utilizada pelo Arduino é baseada em C/C++.", "É exclusivamente Java.", "É exclusivamente Python.", "É uma linguagem baseada apenas em HTML."], "correct": 0}, {"q": "O que é uma Shield?", "options": ["Uma placa de expansão que pode ser conectada ao Arduino para adicionar novas funcionalidades.", "Um tipo de variável.", "Uma estrutura de repetição.", "Um ambiente para compilar programas."], "correct": 0}, {"q": "Quais são as duas funções principais no Arduino?", "options": ["setup() e loop().", "while e for.", "if e switch.", "int e char."], "correct": 0}, {"q": "O que é uma IDE?", "options": ["Um Ambiente de Desenvolvimento Integrado usado para escrever, editar, compilar e enviar programas para o Arduino.", "Uma estrutura para armazenar vários valores.", "Uma placa de expansão.", "Um comando de repetição."], "correct": 0}, {"q": "O que é um algoritmo?", "options": ["Uma sequência de passos e instruções organizados para realizar uma tarefa ou resolver um problema.", "Um valor que não pode ser alterado.", "Uma placa conectada ao Arduino.", "Uma função executada apenas uma vez."], "correct": 0}, {"q": "Qual associação está correta?", "options": ["setup() → configura → 1 vez", "setup() → repete → continuamente", "while → executa → verifica", "variável → valor não muda"], "correct": 0}, {"q": "Qual associação está correta sobre repetição?", "options": ["while → verifica → executa", "do while → executa → verifica", "for → escolhe casos", "if → estrutura de repetição"], "correct": 0}, {"q": "Qual estrutura é usada para escolher entre casos?", "options": ["switch.", "array.", "setup().", "loop()."], "correct": 0}];
const prizes = [1000,1500,2000,2500,3000,4000,5000,6000,7000,8000,10000,12000,15000,18000,20000,25000,30000,35000,40000,45000,50000,60000,70000,80000];
let pool=[],idx=0,money=0,correct=0,wrong=0,skipUsed=false,halfUsed=false,timerId=null,time=30,answered=false;
const $=id=>document.getElementById(id);
function hideAll(){['home','game','result','stats'].forEach(x=>$(x).classList.add('hidden'))}
function goHome(){clearInterval(timerId);hideAll();$('home').classList.remove('hidden')}
function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1])}
function start(){pool=shuffle(questions.map((_,i)=>i));begin()}
function review(){let w=JSON.parse(localStorage.getItem('arduinoWrong')||'[]'); pool=w.filter(i=>i>=0&&i<questions.length); if(!pool.length){alert('Você ainda não tem questões erradas para revisar.');return} begin()}
function begin(){idx=0;money=0;correct=0;wrong=0;skipUsed=false;halfUsed=false;hideAll();$('game').classList.remove('hidden');load()}
function load(){answered=false;time=30;clearInterval(timerId);$('timer').textContent='30 s';$('timer').classList.remove('urgent');$('skip').disabled=skipUsed;let q=questions[pool[idx]];$('count').textContent=(idx+1)+'/'+pool.length;$('score').textContent='R$ '+money.toLocaleString('pt-BR');$('prize').textContent='R$ '+(prizes[idx]||prizes[prizes.length-1]).toLocaleString('pt-BR');$('topic').textContent='Questão '+(idx+1);$('question').textContent=q.q;$('feedback').textContent='';let opts=shuffle(q.options.map((text,i)=>({text,correct:i===q.correct})));$('answers').innerHTML='';opts.forEach((o,i)=>{let b=document.createElement('button');b.className='btn answer';b.textContent=String.fromCharCode(65+i)+') '+o.text;b.dataset.correct=o.correct;b.onclick=()=>answer(b,!!o.correct);$('answers').appendChild(b)});timerId=setInterval(()=>{time--;$('timer').textContent=time+' s';if(time<=10)$('timer').classList.add('urgent');if(time<=0){clearInterval(timerId);timeout()}},1000)}
function answer(btn,isCorrect){if(answered)return;answered=true;clearInterval(timerId);document.querySelectorAll('.answer').forEach(b=>b.disabled=true);if(isCorrect){btn.classList.add('correct');correct++;money=prizes[idx]||money;$('score').textContent='R$ '+money.toLocaleString('pt-BR');$('feedback').textContent='✅ CORRETO!';setTimeout(next,900)}else{btn.classList.add('wrong');wrong++;money=0;saveWrong(pool[idx]);$('feedback').textContent='❌ ERRADO! Você perdeu toda a premiação.';setTimeout(()=>finish('wrong'),1600)}}
function next(){idx++;if(idx>=pool.length)finish('success');else load()}
function finish(type){clearInterval(timerId);hideAll();$('result').classList.remove('hidden');$('resultMoney').textContent='R$ '+money.toLocaleString('pt-BR');if(type==='success'){$('resultTitle').textContent='🎉 PARABÉNS! VOCÊ CONCLUIU!';$('resultText').textContent='Você terminou a rodada com '+correct+' acertos.'}else if(type==='timeout'){$('resultTitle').textContent='⏰ TEMPO ESGOTADO!';$('resultText').textContent='Você perdeu toda a premiação.';money=0;$('resultMoney').textContent='R$ 0'}else{$('resultTitle').textContent='❌ VOCÊ ERROU!';$('resultText').textContent='Você perdeu toda a premiação.'}}
function timeout(){money=0;saveWrong(pool[idx]);finish('timeout')}
function stopGame(){clearInterval(timerId);hideAll();$('result').classList.remove('hidden');$('resultTitle').textContent='🏆 VOCÊ PAROU!';$('resultMoney').textContent='R$ '+money.toLocaleString('pt-BR');$('resultText').textContent='Você ficou com o valor conquistado até aqui.'}
function half(){if(halfUsed||answered)return;halfUsed=true;let bs=[...document.querySelectorAll('.answer')].filter(b=>b.dataset.correct==='false');shuffle(bs).slice(0,2).forEach(b=>{b.style.visibility='hidden'})}
function skip(){if(skipUsed||answered)return;skipUsed=true;idx++;if(idx>=pool.length)finish('success');else load()}
function saveWrong(i){let w=JSON.parse(localStorage.getItem('arduinoWrong')||'[]');if(!w.includes(i))w.push(i);localStorage.setItem('arduinoWrong',JSON.stringify(w));}
function stats(){hideAll();$('stats').classList.remove('hidden');let t=+localStorage.getItem('arduinoTotal')||0,a=+localStorage.getItem('arduinoCorrect')||0,w=+localStorage.getItem('arduinoErrors')||0;$('statsText').innerHTML='Total de respostas: <b>'+t+'</b><br>Acertos: <b>'+a+'</b><br>Erros: <b>'+w+'</b>'}
document.addEventListener('click',e=>{if(e.target.classList.contains('answer')){let t=+localStorage.getItem('arduinoTotal')||0;localStorage.setItem('arduinoTotal',t+1);if(e.target.dataset.correct==='true'){let a=+localStorage.getItem('arduinoCorrect')||0;localStorage.setItem('arduinoCorrect',a+1)}else{let w=+localStorage.getItem('arduinoErrors')||0;localStorage.setItem('arduinoErrors',w+1)}}});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body></html>
