function buildPrizes(n){
  const prizes=[];
  // 1) De R$ 1.000 em R$ 1.000 até R$ 10.000 (perguntas 1-10)
  for(let i=1;i<=Math.min(10,n);i++) prizes.push(i*1000);
  if(n<=10) return prizes;
  // 2) De R$ 5.000 em R$ 5.000 até R$ 50.000 (perguntas 11-18)
  for(let v=15000;v<=50000 && prizes.length<n;v+=5000) prizes.push(v);
  // 3) De R$ 10.000 em R$ 10.000 até R$ 200.000 (perguntas 19-33)
  for(let v=60000;v<=200000 && prizes.length<n;v+=10000) prizes.push(v);
  // 4) A partir de R$ 200.000, distribuir uniformemente até R$ 1.000.000.
  //    A última pergunta do modo escolhido sempre vale exatamente R$ 1.000.000.
  const start=prizes.length;
  const remaining=n-start;
  if(remaining>0){
    for(let k=1;k<=remaining;k++){
      const value=200000 + (800000*k/remaining);
      prizes.push(k===remaining?1000000:Math.round(value));
    }
  }
  return prizes;
}

function playAudio(a){if(!soundOn)return;a.currentTime=0;a.play().catch(()=>{})}
function toggleSound(){soundOn=!soundOn;$('soundBtn').textContent=soundOn?'🔊 SOM: LIGADO':'🔇 SOM: DESLIGADO';if(!soundOn){bgMusic.pause()}else{bgMusic.play().catch(()=>{})}}
document.addEventListener('touchstart',()=>{if(soundOn)bgMusic.play().catch(()=>{})},{once:true});
function hideAll(){['home','game','result','stats'].forEach(x=>$(x).classList.add('hidden'))}
function goHome(){clearInterval(timerId);hideAll();$('home').classList.remove('hidden')}
function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1])}
function startMode(mode){gameMode=mode;start()}
function start(){playAudio(new Audio('sera-que-alguem-vai-ganhar-1-milhao-de-reais.mp3'));if(soundOn)bgMusic.play().catch(()=>{});let base=questions.map((q,i)=>({q,i}));if(gameMode==='redes')base=base.filter(x=>x.q.topic==='🌐 Redes'||x.q.topic==='🌐 Redes / HART');if(gameMode==='programacao')base=base.filter(x=>x.q.topic==='🤖 Arduino / LP');pool=shuffle(base.map(x=>x.i));if(!pool.length){alert('Não há perguntas para este tema.');return}prizes=buildPrizes(pool.length);begin()}
function review(){let w=JSON.parse(localStorage.getItem('milhaoWrong')||'[]');pool=w.filter(i=>i>=0&&i<questions.length);if(!pool.length){alert('Você ainda não tem questões erradas para revisar.');return}gameMode='all';prizes=buildPrizes(pool.length);begin()}
function begin(){idx=0;money=0;correct=0;wrong=0;skipUsed1=false;skipUsed2=false;card3Used=false;card2Used=false;card1Used=false;hideAll();$('game').classList.remove('hidden');load()}
function load(){answered=false;time=40;clearInterval(timerId);$('timer').textContent='40 s';$('timer').classList.remove('urgent');$('skip1').disabled=skipUsed1;$('skip2').disabled=skipUsed2;$('card3').disabled=card3Used;$('card2').disabled=card2Used;$('card1').disabled=card1Used;let q=questions[pool[idx]];$('count').textContent=(idx+1)+'/'+pool.length;$('score').textContent='R$ '+money.toLocaleString('pt-BR');$('prize').textContent='R$ '+(prizes[idx]||prizes[prizes.length-1]).toLocaleString('pt-BR');$('topic').textContent='Questão '+(idx+1);$('subject').textContent=q.topic||'';$('question').textContent=q.q;$('feedback').textContent='';let opts=shuffle(q.options.map((text,i)=>({text,correct:i===q.correct})));$('answers').innerHTML='';opts.forEach((o,i)=>{let b=document.createElement('button');b.className='btn answer';b.textContent=String.fromCharCode(65+i)+') '+o.text;b.dataset.correct=o.correct?'true':'false';b.onclick=()=>answer(b,o.correct);$('answers').appendChild(b)});timerId=setInterval(()=>{time--;$('timer').textContent=time+' s';if(time<=10)$('timer').classList.add('urgent');if(time<=0){clearInterval(timerId);timeout()}},1000)}
function answer(btn,isCorrect){if(answered)return;answered=true;clearInterval(timerId);let q=questions[pool[idx]];let buttons=[...document.querySelectorAll('.answer')];buttons.forEach(b=>b.disabled=true);if(isCorrect){playAudio(somCerto);btn.classList.add('correct');correct++;money=prizes[idx]||money;$('score').textContent='R$ '+money.toLocaleString('pt-BR');$('feedback').textContent='✅ CORRETO!';if(idx===pool.length-1&&money===1000000){setTimeout(()=>{playAudio(somMilhao);finish('success')},900)}else{setTimeout(next,900)}}else{playAudio(somErrado);btn.classList.add('wrong');wrong++;money=0;saveWrong(pool[idx]);let correctButton=buttons.find(b=>b.dataset.correct==='true');if(correctButton)correctButton.classList.add('correct');$('feedback').innerHTML='❌ <b>ERRADO!</b><br>Resposta correta: <b>'+q.options[q.correct]+'</b>';setTimeout(()=>finish('wrong'),3000)}}
function next(){idx++;if(idx>=pool.length)finish('success');else load()}
function finish(type){clearInterval(timerId);hideAll();$('result').classList.remove('hidden');$('resultMoney').textContent='R$ '+money.toLocaleString('pt-BR');if(type==='success'){if(money===1000000){$('resultTitle').textContent='🎉 PARABÉNS! VOCÊ GANHOU R$ 1 MILHÃO!';$('resultText').textContent='Você acertou a última pergunta e conquistou o prêmio máximo de R$ 1.000.000!'}else{$('resultTitle').textContent='🎉 PARABÉNS! VOCÊ CONCLUIU!';$('resultText').textContent='Você terminou a rodada com '+correct+' acertos e chegou a R$ '+money.toLocaleString('pt-BR')+'.'}}else if(type==='timeout'){$('resultTitle').textContent='⏰ TEMPO ESGOTADO!';$('resultText').textContent='Você perdeu toda a premiação.';money=0;$('resultMoney').textContent='R$ 0'}else{$('resultTitle').textContent='❌ VOCÊ ERROU!';$('resultText').textContent='Você perdeu toda a premiação.'}}
function timeout(){money=0;saveWrong(pool[idx]);$('feedback').textContent='⏰ TEMPO ESGOTADO! Resposta correta: '+questions[pool[idx]].options[questions[pool[idx]].correct];finish('timeout')}
function stopGame(){clearInterval(timerId);hideAll();$('result').classList.remove('hidden');$('resultTitle').textContent='🏆 VOCÊ PAROU!';$('resultMoney').textContent='R$ '+money.toLocaleString('pt-BR');$('resultText').textContent='Você ficou com o valor conquistado até aqui.'}
function removeRandom(n){if(answered)return;if((n===3&&card3Used)||(n===2&&card2Used)||(n===1&&card1Used))return;if(n===3)card3Used=true;if(n===2)card2Used=true;if(n===1)card1Used=true;let bs=[...document.querySelectorAll('.answer')].filter(b=>b.dataset.correct==='false'&&b.style.visibility!=='hidden');shuffle(bs).slice(0,n).forEach(b=>b.style.visibility='hidden');if(n===3)$('card3').disabled=true;if(n===2)$('card2').disabled=true;if(n===1)$('card1').disabled=true}
function skip(){if(answered)return;if(!skipUsed1){skipUsed1=true;idx++;if(idx>=pool.length)finish('success');else load();return}if(!skipUsed2){skipUsed2=true;idx++;if(idx>=pool.length)finish('success');else load();}}
function saveWrong(i){let w=JSON.parse(localStorage.getItem('milhaoWrong')||'[]');if(!w.includes(i))w.push(i);localStorage.setItem('milhaoWrong',JSON.stringify(w))}
function stats(){hideAll();$('stats').classList.remove('hidden');let t=+localStorage.getItem('milhaoTotal')||0,a=+localStorage.getItem('milhaoCorrect')||0,w=+localStorage.getItem('milhaoErrors')||0;$('statsText').innerHTML='Total de respostas: <b>'+t+'</b><br>Acertos: <b>'+a+'</b><br>Erros: <b>'+w+'</b>'}
document.addEventListener('click',e=>{if(e.target.classList.contains('answer')){let t=+localStorage.getItem('milhaoTotal')||0;localStorage.setItem('milhaoTotal',t+1);if(e.target.dataset.correct==='true'){let a=+localStorage.getItem('milhaoCorrect')||0;localStorage.setItem('milhaoCorrect',a+1)}else{let w=+localStorage.getItem('milhaoErrors')||0;localStorage.setItem('milhaoErrors',w+1)}}});
</script></body></html>
